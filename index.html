/* ---- chamadas de voz e vídeo (WebRTC + Firestore) ---- */
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
let call=null;const mmss=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const setStatus=t=>{if(call)call.st.textContent=t};
function addCand(c){const k=call;if(!k)return;k.pc.remoteDescription?k.pc.addIceCandidate(c).catch(()=>{}):k.pending.push(c)}
function flush(){const k=call;if(!k)return;k.pending.forEach(c=>k.pc.addIceCandidate(c).catch(()=>{}));k.pending=[]}
function callUI(uid,type){const rv=$('video',{className:'rv',autoplay:true,playsInline:true}),lv=$('video',{className:'lv',autoplay:true,playsInline:true,muted:true}),st=$('div',{className:'cs',textContent:'Chamando…'}),
  mic=$('button',{className:'cbtn',textContent:'🎤'}),cam=$('button',{className:'cbtn',textContent:'📹'}),end=$('button',{className:'cbtn red',textContent:'📵'});
  const ov=$('div',{className:'call'+(type=='video'?' v':'')},rv,lv,st,$('div',{className:'ci'},avU(uid,1),$('b',{textContent:nm(uid)})),$('div',{className:'cb'},mic,...(type=='video'?[cam]:[]),end));
  document.body.append(ov);return{ov,rv,lv,st,mic,cam,end}}
async function prep(uid,type,role){const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:type=='video'?{facingMode:'user'}:false});
  const pc=new RTCPeerConnection(ICE);stream.getTracks().forEach(t=>pc.addTrack(t,stream));const ui=callUI(uid,type);
  call={pc,stream,uid,type,role,unsubs:[],pending:[],ov:ui.ov,st:ui.st};ui.lv.srcObject=stream;
  pc.ontrack=e=>{ui.rv.srcObject=e.streams[0];if(type=='video')ui.ov.classList.add('vid')};
  pc.onconnectionstatechange=()=>{const k=call;if(!k)return;if(pc.connectionState=='connected'&&!k.t0){k.t0=Date.now();clearTimeout(k.timeout);k.timer=setInterval(()=>setStatus(mmss(Date.now()-k.t0)),1000);setStatus('00:00')}
    if(pc.connectionState=='failed')endCall('Falha na conexão')};
  const tog=(btn,kind,on,off)=>btn.onclick=()=>{const t=stream[kind=='a'?'getAudioTracks':'getVideoTracks']()[0];if(!t)return;t.enabled=!t.enabled;btn.textContent=t.enabled?on:off;btn.classList.toggle('off',!t.enabled)};
  tog(ui.mic,'a','🎤','🔇');tog(ui.cam,'v','📹','🚫');ui.end.onclick=()=>endCall('Encerrada')}
async function startCall(uid,type){if(call||!uid)return;
  try{await prep(uid,type,'out');const c=call,pc=c.pc,ref=doc(collection(db,'calls'));c.id=ref.id;
    pc.onicecandidate=e=>e.candidate&&addDoc(collection(ref,'callerCandidates'),e.candidate.toJSON());
    const offer=await pc.createOffer();await pc.setLocalDescription(offer);
    await setDoc(ref,{from:me,to:uid,type,status:'ringing',offer:{type:offer.type,sdp:offer.sdp},ts:Date.now()});
    c.unsubs.push(onSnapshot(ref,async s=>{const d=s.data();if(!d||!call)return;
      if(d.answer&&!pc.currentRemoteDescription){await pc.setRemoteDescription(d.answer);flush();setStatus('Conectando…')}
      if(d.status=='declined')endCall('Chamada recusada',false);if(d.status=='ended')endCall('Chamada encerrada',false)}));
    c.unsubs.push(onSnapshot(collection(ref,'calleeCandidates'),s=>s.docChanges().forEach(ch=>ch.type=='added'&&addCand(ch.doc.data()))));
    c.timeout=setTimeout(()=>{if(call==c&&!c.t0)endCall('Sem resposta')},45000);
  }catch(e){endCall('',false);alert('Não foi possível iniciar a chamada. Permita o uso do microfone'+(type=='video'?' e da câmera':'')+' e tente de novo.')}}
function incoming(id,d){if(call){updateDoc(doc(db,'calls',id),{status:'declined'}).catch(()=>{});return}

  const ov=$('div',{className:'call'},$('div',{className:'ci'},avU(d.from,1),$('b',{textContent:nm(d.from)}),$('div',{className:'mu',textContent:'Chamada de '+(d.type=='video'?'vídeo':'voz')+'…'})),
    $('div',{className:'cb'},$('button',{className:'cbtn red',textContent:'📵',onclick:()=>{ov.remove();updateDoc(doc(db,'calls',id),{status:'declined'}).catch(()=>{})}}),$('button',{className:'cbtn green',textContent:'📞',onclick:()=>{ov.remove();answer(id,d)}})));
  ov.dataset.cid=id;document.body.append(ov);navigator.vibrate&&navigator.vibrate([300,200,300])}
async function answer(id,d){try{await prep(d.from,d.type,'in');const c=call,pc=c.pc,ref=doc(db,'calls',id);c.id=id;
    pc.onicecandidate=e=>e.candidate&&addDoc(collection(ref,'calleeCandidates'),e.candidate.toJSON());

function endCall(msg,notify=true){const c=call;if(!c)return;call=null;clearTimeout(c.timeout);clearInterval(c.timer);c.unsubs.forEach(u=>u());

    addDoc(collection(db,'chats',cid,'messages'),{from:me,text,ts}).then(()=>updateDoc(doc(db,'chats',cid),{last:{text,from:me,ts}})).catch(()=>{})}}
